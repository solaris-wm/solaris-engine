name: SolarisEngine
# Host-side environment for postprocessing (orchestrate.py postprocess, etc.).
# Versions are pinned to what has been tested; bump them deliberately.
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26
  # The "gpl" build is required: conda-forge also publishes "lgpl" ffmpeg
  # builds, which omit libx264. This build also includes h264_nvenc.
  # postprocess/process_recordings.py uses the ffmpeg in this env (next to
  # the Python interpreter) ahead of any system ffmpeg on PATH.
  - ffmpeg=8.0.1=gpl*
  - tqdm
  - pillow
  - pip
  - pyyaml
  - pip:
      # OpenCV is only used to decode/seek the camera recordings; the pip
      # wheel bundles its own FFmpeg libraries, independent of the CLI above.
      - opencv-python==4.11.0.86
